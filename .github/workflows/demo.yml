name: Deploy interactive demo

on:
  push:
    branches: [main]
    paths:
      - 'dev/**'
      - 'custom_components/room_comfort/frontend/**'
      - 'scripts/build_demo.py'
      - 'tests/frontend.cjs'
      - 'package*.json'
      - '.github/workflows/demo.yml'
  pull_request:
    paths:
      - 'dev/**'
      - 'custom_components/room_comfort/frontend/**'
      - 'scripts/build_demo.py'
      - 'tests/frontend.cjs'
      - 'package*.json'
      - '.github/workflows/demo.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: demo-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - run: npm run check
      - run: npm test
      - name: Build portable demo
        run: python3 scripts/build_demo.py
      - name: Test deployed project-path layout
        run: DEMO_TEST_PATH=/ha-room-comfort/ npm test
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist/demo

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v6
      - name: Deploy demo
        id: deployment
        uses: actions/deploy-pages@v5
