name: Publish versioned release

# Runs after every check in validate.yml passes. Rerun that workflow to retry.
on:
  workflow_call:

permissions:
  contents: write

concurrency:
  group: room-comfort-release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 scripts/validate.py
      - run: python3 scripts/package.py
      - run: python3 scripts/release_notes.py > dist/release-notes.md
      - name: Publish release and ZIP assets
        uses: actions/github-script@v8
        with:
          script: |
            const publish = require('./scripts/publish_release.cjs');
            await publish({github, context, core});

