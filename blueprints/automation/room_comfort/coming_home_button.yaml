blueprint:
  name: Room Comfort — coming-home button
  description: >-
    Connect an Input button helper to Room Comfort's shared Coming home comfort
    switch. Pressing it clears Vacation and prepares enabled rooms using each
    room's selected Heat/Cool return mode and Home target. Does not enable live
    control. Existing arrival, cancellation and timeout rules still apply.
  domain: automation
  author: qmciaq
  homeassistant:
    min_version: "2024.10.0"
  input:
    button:
      name: Input button helper
      selector:
        entity:
          filter:
            domain: input_button
    coming_home:
      name: Room Comfort — Coming home comfort switch
      selector:
        entity:
          filter:
            domain: switch
            integration: room_comfort
mode: single
variables:
  coming_home: !input coming_home
triggers:
  - trigger: state
    entity_id: !input button
    to: null
conditions:
  - condition: template
    value_template: >-
      {{ trigger.from_state is not none and trigger.to_state is not none
         and trigger.from_state.state != 'unavailable'
         and trigger.to_state.state not in ['unknown', 'unavailable']
         and trigger.from_state.state != trigger.to_state.state }}
  - condition: template
    value_template: >-
      {{ (state_attr(coming_home, 'household_entities') or {}).get('coming_home') == coming_home }}
actions:
  - action: switch.turn_on
    target:
      entity_id: !input coming_home
