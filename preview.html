    const homeEntities={vacation:'switch.home_vacation',coming_home:'switch.home_coming_home',automatic_away:'switch.home_automatic_away',mode:'sensor.home_mode'};
    for(const key of ['vacation','coming_home','automatic_away'])put(homeEntities[key],key==='automatic_away'?'on':'off',{friendly_name:key});
    put('person.dominik','home',{friendly_name:'Dominik'});put('person.patrycja','home',{friendly_name:'Patrycja'});
    put(homeEntities.mode,'home',{room_comfort_household:true,home_profile:'home',household_entities:homeEntities,memberships:{'person.dominik':true,'person.patrycja':true},away_delay_minutes:5,prewarm_ready:false});
    function homeProfile(profile){
      replace(homeEntities.mode,profile,{home_profile:profile,prewarm_ends_at:profile==='prewarming'?Date.now()/1000+14400:null});
      for(const room of Object.values(states).filter(e=>e.attributes.room_comfort)){const mode=profile==='prewarming'&&room.attributes.control_devices?room.attributes.coming_home_mode:room.state;const targets=mode==='cool'?room.attributes.cooling_profile_temperatures:room.attributes.heating_profile_temperatures;replace(room.entity_id,mode,{home_profile:profile,temperature:targets[profile==='prewarming'?'home':profile]});recalc(states[room.entity_id]);}
    }
    function replace(id,value,attributes={}){const e=states[id];put(id,value??e.state,{...e.attributes,...attributes});}
    function recalc(e){
      let a=e.attributes;
      const targets=e.state==='cool'?a.cooling_profile_temperatures:a.heating_profile_temperatures;
      const ids=e.state==='cool'?a.cooling_profile_temperature_entities:a.heating_profile_temperature_entities;
      a={...a,profile_temperatures:targets,profile_temperature_entities:ids,temperature:targets[a.home_profile==='prewarming'?'home':a.home_profile]};
      const boosting=a.boost_ends_at>Date.now()/1000;
      const desired=e.state==='heat'&&a.current_temperature<a.temperature?'heating':e.state==='cool'&&a.current_temperature>a.temperature?'cooling':e.state==='off'?'off':'idle';
      const status=boosting&&desired==='heating'?'boosting':desired;
      const attrs={...a,demand_status:status,controller_status:a.control_devices?status:'observe_only',desired_radiator_heat:['heating','boosting'].includes(status),desired_ac_mode:status==='boosting'?'heat':status==='cooling'?'cool':'off'};
      put(e.entity_id,e.state,attrs);
      if(a.control_devices){a.radiators.forEach(id=>replace(id,attrs.desired_radiator_heat?'heat':'off'));if(a.air_conditioner&&states[a.air_conditioner].state!=='unavailable')replace(a.air_conditioner,attrs.desired_ac_mode);}
    }
    const hass={states,language:'en',locale:{language:'en'},config:{unit_system:{temperature:'°C'}},
      async callService(domain,service,data={},target={}){
        calls.push({domain,service,data,target});
        if(failNext){failNext=false;throw new Error('Device did not respond. Please try again.');}
        const id=target.entity_id;
        let e=states[id];
        if(domain==='climate'){
          if(service==='set_temperature'){const field=e.state==='cool'?'cooling_profile_temperatures':'heating_profile_temperatures';const profile=e.attributes.home_profile==='prewarming'?'home':e.attributes.home_profile;replace(id,null,{temperature:data.temperature,[field]:{...e.attributes[field],[profile]:data.temperature}});}
          if(service==='set_hvac_mode')replace(id,data.hvac_mode,{boost_ends_at:null,preset_mode:'radiators'});
          if(service==='set_preset_mode'){
            if(data.preset_mode==='boost'&&states[e.attributes.air_conditioner]?.state==='unavailable')throw new Error('The room air conditioner is unavailable');
            replace(id,'heat',{preset_mode:data.preset_mode,boost_ends_at:data.preset_mode==='boost'?Date.now()/1000+1200:null});
          }
          recalc(states[id]);
        }
        if(domain==='number'){
          replace(id,String(data.value));
          const room=Object.values(states).find(e=>[...Object.values(e.attributes.heating_profile_temperature_entities||{}),...Object.values(e.attributes.cooling_profile_temperature_entities||{})].includes(id));
          const cooling=Object.values(room.attributes.cooling_profile_temperature_entities||{}).includes(id);
          const ids=cooling?room.attributes.cooling_profile_temperature_entities:room.attributes.heating_profile_temperature_entities;
          const field=cooling?'cooling_profile_temperatures':'heating_profile_temperatures';
          const profile=Object.keys(ids).find(k=>ids[k]===id);
          replace(room.entity_id,null,{[field]:{...room.attributes[field],[profile]:data.value}});recalc(states[room.entity_id]);
        }
        if(domain==='select'){
          replace(id,data.option);const room=Object.values(states).find(e=>e.attributes.coming_home_mode_entity===id);
          replace(room.entity_id,null,{coming_home_mode:data.option});
          if(states[homeEntities.coming_home].state==='on')homeProfile('prewarming');
        }
        if(domain==='switch'&&Object.values(homeEntities).includes(id)){
          replace(id,service==='turn_on'?'on':'off');
          if(id===homeEntities.vacation&&service==='turn_on')replace(homeEntities.coming_home,'off');
          if(id===homeEntities.coming_home&&service==='turn_on')replace(homeEntities.vacation,'off');
          homeProfile(states[homeEntities.coming_home].state==='on'?'prewarming':states[homeEntities.vacation].state==='on'?'vacation':'home');refresh();return;
        }
        if(domain==='switch'){
          replace(id,service==='turn_on'?'on':'off');
          const room=Object.values(states).find(e=>e.attributes.control_switch===id);
          replace(room.entity_id,null,{control_devices:service==='turn_on',boost_ends_at:null});
          if(service==='turn_off'){room.attributes.radiators.forEach(id=>replace(id,'off'));if(room.attributes.air_conditioner)replace(room.attributes.air_conditioner,'off');}
          recalc(states[room.entity_id]);
        }
        if(domain==='button'){
          const room=Object.values(states).find(e=>e.attributes.cancel_boost_button===id);
          replace(room.entity_id,null,{boost_ends_at:null,preset_mode:'radiators'});recalc(states[room.entity_id]);
        }
        refresh();
      }
    };
    const overview=document.getElementById('overview');
    overview.setConfig({title:'Room Comfort'});
    function refresh(){overview.hass={...hass,states:{...states}};}
    refresh();
    let toastTimer;
    document.addEventListener('hass-more-info',e=>{const toast=document.getElementById('toast');toast.textContent=`Home Assistant opens details & history for ${e.detail.entityId}`;toast.hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>toast.hidden=true,4000);});
    document.getElementById('theme').addEventListener('click',()=>{
      const dark=document.documentElement.dataset.theme!=='dark';document.documentElement.dataset.theme=dark?'dark':'light';
      const vars=dark?{'--primary-background-color':'#171e1b','--primary-text-color':'#e2e9e2','--secondary-text-color':'#9da89c','--divider-color':'#364039','--card-background-color':'#222c25'}:{'--primary-background-color':'#f5f6f2','--primary-text-color':'#293229','--secondary-text-color':'#7c837a','--divider-color':'#e5e8df','--card-background-color':'#fff'};
      for(const [key,value] of Object.entries(vars))document.documentElement.style.setProperty(key,value);
      document.getElementById('theme').textContent=dark?'Light mode':'Dark mode';
    });
    document.getElementById('fault').addEventListener('click',()=>{const id='climate.salon_ac';const offline=states[id].state!=='unavailable';replace(id,offline?'unavailable':'off');refresh();document.getElementById('fault').textContent=offline?'Restore AC':'Simulate AC offline';});
    document.getElementById('observe').addEventListener('click',()=>hass.callService('switch',states['climate.salon'].attributes.control_devices?'turn_off':'turn_on',{}, {entity_id:'switch.salon_control'}));
    document.getElementById('language').addEventListener('change',e=>{hass.language=e.target.value;refresh();});
    // Local test surface. It exists only in this demo, never in the HA frontend.
    window.demo={states,calls,refresh,replace,hass,failNext:()=>{failNext=true;}};
  </script>
</body>
</html>
